<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obsidian – Create an account</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link href="/static/auth/register/register.css" rel="stylesheet" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <div class="brand-logo">
          <span class="material-symbols-outlined">chat_bubble</span>
        </div>
        <span class="brand-name">Obsidian</span>
      </div>
    </header>

    <main class="site-main">
      <section class="register-section">
        <!-- Background glow -->
        <div class="register-glow register-glow-primary"></div>
        <div class="register-glow register-glow-secondary"></div>

        <div class="register-container">
          <div class="register-header">
            <div class="register-logo">
              <span class="material-symbols-outlined">chat_bubble</span>
            </div>
            <h1 class="register-title">Create an account</h1>
            <p class="register-subtitle">
              Join your team workspace and start messaging immediately
            </p>
          </div>

          <div class="register-card">
            <form class="register-form" id="register-form">
              <div class="form-field">
                <label for="signup-display-name">Display Name</label>
                <div class="input-group">
                  <span class="material-symbols-outlined input-icon"
                    >badge</span
                  >
                  <input
                    id="signup-display-name"
                    type="text"
                    placeholder="Alex Mercer"
                    required
                  />
                </div>
              </div>

              <div class="form-field">
                <label for="signup-username">Username</label>
                <div class="input-group">
                  <span class="material-symbols-outlined input-icon"
                    >alternate_email</span
                  >
                  <input
                    id="signup-username"
                    type="text"
                    placeholder="alexvippro"
                    required
                  />
                </div>
              </div>

              <div class="form-field">
                <label for="signup-password">Password</label>
                <div class="input-group">
                  <span class="material-symbols-outlined input-icon">key</span>
                  <input
                    id="signup-password"
                    class="input-with-toggle"
                    type="password"
                    placeholder="Create a strong password"
                    required
                  />
                  <button
                    type="button"
                    id="password-toggle-btn"
                    class="password-toggle-btn"
                    aria-label="Toggle password visibility"
                  >
                    <span
                      class="material-symbols-outlined"
                      id="password-toggle-icon"
                      >visibility</span
                    >
                  </button>
                </div>

                <div class="strength-meter">
                  <div class="strength-bars">
                    <div class="strength-bar" id="strength-bar-1"></div>
                    <div class="strength-bar" id="strength-bar-2"></div>
                    <div class="strength-bar" id="strength-bar-3"></div>
                    <div class="strength-bar" id="strength-bar-4"></div>
                  </div>
                </div>
              </div>

              <button type="submit" id="register-btn" class="btn-primary">
                <span>Create Account</span>
                <span class="material-symbols-outlined">arrow_forward</span>
              </button>
            </form>
          </div>

          <div class="login-prompt">
            <p>
              Already have an account?
              <a href="#" class="login-link" data-path="login">Sign in</a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/auth/register/register.js"></script>
  </body>
</html>
